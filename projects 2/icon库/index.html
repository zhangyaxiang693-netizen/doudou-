<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>图标库</title>
  <style>
    body{margin:0;padding:24px;background:#f5f6f8;color:#17212f;font-family:Arial,sans-serif}
    h1{margin:0 0 6px;font-size:22px}.note{margin:0 0 22px;color:#667085;font-size:13px}
    h2{margin:28px 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .card{min-height:150px;padding:12px;background:#fff;border:1px solid #e4e7ec;border-radius:8px;text-align:center}
    .icon{height:88px;display:grid;place-items:center}.icon img{max-width:76px;max-height:76px}
    .name{font-size:12px;font-weight:600;line-height:1.35;color:#344054}.id{margin-top:4px;font-size:10px;color:#98a2b3;word-break:break-all}
    .color{margin-top:5px;font-size:10px;color:#667085}
  </style>
</head>
<body>
  <h1>图标库</h1>
  <p class="note">正式名称、分类和颜色映射来自 icon-manifest.json。</p>
  <main id="app">加载中...</main>
  <script>
    const colorNames = { pink: '粉色', red: '红色', magenta: '玫红色', coral: '珊瑚色', purple: '紫色', orange: '橘色', blue: '蓝色' };
    fetch('./icon-manifest.json')
      .then((response) => response.json())
      .then((manifest) => {
        document.querySelector('#app').innerHTML = manifest.categories.map((category) => `
          <section>
            <h2>${category.name}</h2>
            <div class="grid">
              ${category.icons.map((icon) => {
                const entries = icon.variants
                  ? Object.entries(icon.variants).map(([color, source]) => ({ color: colorNames[color] || color, source }))
                  : [{ color: icon.color || '特殊颜色', source: icon.source }];
                return entries.map((entry) => `
                  <figure class="card">
                    <div class="icon"><img src="./${entry.source}" alt="${icon.name}" /></div>
                    <figcaption class="name">${icon.name}</figcaption>
                    <div class="id">${icon.id}</div>
                    <div class="color">${entry.color}</div>
                  </figure>
                `).join('');
              }).join('')}
            </div>
          </section>
        `).join('');
      })
      .catch(() => { document.querySelector('#app').textContent = '图标索引加载失败'; });
  </script>
</body>
</html>
